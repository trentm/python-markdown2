<p>An inline image <img src="/img/a~~b~~c.png" alt="~~Alt~~"> keeps its attributes.</p>

<p>A raw <span title="~~note~~"><s>span</s></span> is struck only in its text.</p>

<p>A <a href="https://example.com/" title="~~Title~~">link</a> and an <img src="/img/a.png" alt="image" title="~~Title~~" /> keep their titles.</p>

<p>An inline <!-- ~~comment~~ --> is left alone, but <s>this</s> is struck.</p>

<p><s>Struck text around <b>a tag</b> still works.</s></p>
